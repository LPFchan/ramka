<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Match Next.js / the docs landing page. viewport-fit=cover puts Chrome
       Android into a larger viewport where this overlay does not poke
       browser controls (verified on emulator: 844px vs landing 820px). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tap the button</title>
  <style>
    html { color-scheme: light; }
    html, body { margin: 0; }
    body {
      font: 18px/1.35 system-ui, sans-serif;
      background: #fff;
      color: #111;
      text-align: center;
      min-height: 300vh;
    }
    #status {
      box-sizing: border-box;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      font: 700 20px/1.2 system-ui, sans-serif;
      background: #eee;
    }
    #status.skip { background: #b3261e; color: #fff; }
    #status.ok { background: #0d7a3f; color: #fff; }
    main { padding: 32px 16px; }
    #go {
      display: block;
      width: min(88vw, 360px);
      margin: 32px auto;
      padding: 28px 16px;
      font: 700 22px/1.2 system-ui, sans-serif;
      color: #fff;
      background: #1a73e8;
      border: 0;
      border-radius: 14px;
    }
    .hint { opacity: 0.7; max-width: 22em; margin: 0 auto; }
    .card {
      height: 28vh;
      margin: 16px;
      border-radius: 12px;
      background: #e8e8e8;
    }
    .lightbox-demo-content {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      overscroll-behavior: contain;
      background: rgba(0, 0, 0, 0.85);
      --lightbox-inset-top: calc(4rem + env(safe-area-inset-top, 0px));
      --lightbox-inset-bottom: calc(4rem + env(safe-area-inset-bottom, 0px));
    }
  </style>
</head>
<body>
  <div id="status">Tap the blue button</div>
  <main>
    <p class="hint">Stay at the top so the URL bar is showing, then tap once.</p>
    <button type="button" id="go">Tap me</button>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </main>
  <script>
    const status = document.getElementById('status');
    const go = document.getElementById('go');
    let resizes = 0;
    let fake = 0;
    let baseline = '';

    function sizeKey() {
      const vv = window.visualViewport;
      const inner = window.innerWidth + '×' + window.innerHeight;
      const vvs = vv ? Math.round(vv.width) + '×' + Math.round(vv.height) : 'n/a';
      return inner + ' / ' + vvs;
    }

    window.addEventListener('resize', () => {
      resizes += 1;
      if (sizeKey() === baseline) fake += 1;
    });

    function twoFrames() {
      return new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    }

    go.addEventListener('click', async () => {
      baseline = sizeKey();
      resizes = 0;
      fake = 0;

      const content = document.createElement('div');
      content.className = 'lightbox-demo-content';
      document.body.append(content);
      document.documentElement.style.overflow = 'hidden';
      void content.offsetHeight;
      await twoFrames();

      content.style.display = 'none';
      await twoFrames();

      content.remove();
      document.documentElement.style.overflow = '';

      if (fake) {
        status.className = 'skip';
        status.textContent = 'FAKE RESIZE  ×' + fake + '  size unchanged';
      } else if (resizes) {
        status.className = '';
        status.textContent = 'resize ×' + resizes + '  (size changed)';
      } else {
        status.className = 'ok';
        status.textContent = 'OK  no resize  innerH=' + window.innerHeight;
      }
    });
  </script>
</body>
</html>
