<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Match Next.js / the docs landing page. viewport-fit=cover puts Chrome
       Android into a larger viewport where this overlay does not poke
       browser controls (verified on emulator: 844px vs landing 820px). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tap the photo</title>
  <style>
    html { color-scheme: light; }
    html, body { margin: 0; }
    body {
      font: 18px/1.35 system-ui, sans-serif;
      background: #fff;
      color: #111;
      min-height: 300vh;
    }
    #status {
      box-sizing: border-box;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      font: 700 20px/1.2 system-ui, sans-serif;
      text-align: center;
      background: #eee;
    }
    #status.skip { background: #b3261e; color: #fff; }
    #status.ok { background: #0d7a3f; color: #fff; }
    main { padding: 24px 16px 80px; text-align: center; }
    #thumb {
      width: min(72vw, 280px);
      height: calc(min(72vw, 280px) * 0.66);
      margin: 24px auto;
      border-radius: 12px;
      background: #1a73e8;
      cursor: pointer;
    }
    .hint { opacity: 0.7; max-width: 22em; margin: 0 auto; }
    .card {
      height: 28vh;
      margin: 16px;
      border-radius: 12px;
      background: #e8e8e8;
    }
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000;
    }
    .lightbox-demo-content {
      position: fixed;
      inset: 0;
      z-index: 11;
      overflow: hidden;
      overscroll-behavior: contain;
      --lightbox-inset-top: calc(4rem + env(safe-area-inset-top, 0px));
      --lightbox-inset-bottom: calc(4rem + env(safe-area-inset-bottom, 0px));
    }
    .hero {
      position: absolute;
      inset: 10%;
      background: #1a73e8;
      border-radius: 12px;
    }
    ::view-transition-group(photo) { animation-duration: 0.45s; }
  </style>
</head>
<body>
  <div id="status">Tap the photo</div>
  <main>
    <p class="hint">Stay at the top so the URL bar is showing, then tap once.</p>
    <div id="thumb" role="button" tabindex="0" aria-label="Open"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </main>
  <script>
    const status = document.getElementById('status');
    const thumb = document.getElementById('thumb');
    let busy = false;

    function setStatus(text, kind) {
      status.textContent = text;
      status.className = kind || '';
    }

    function name(el) {
      el.style.setProperty('view-transition-name', 'photo', 'important');
    }
    function unname(el) {
      el.style.setProperty('view-transition-name', 'none', 'important');
    }

    function runVT(update) {
      if (typeof document.startViewTransition !== 'function') {
        return Promise.resolve({ skip: 'No View Transitions', ms: 0 });
      }
      const t0 = performance.now();
      const t = document.startViewTransition(update);
      let skip = '';
      t.ready.then(
        () => {},
        (e) => { skip = e.name + ': ' + e.message; },
      );
      return t.finished.then(() => {
        const ms = Math.round(performance.now() - t0);
        // Skip-after-activation: ready fulfills, then Blink aborts during the
        // animation (SnapshotRootDidChangeSize). finished is ~8–50ms instead
        // of the 450ms group duration. ready-reject is the other skip path.
        if (!skip && ms < 120) {
          skip = 'finished in ' + ms + 'ms (aborted after ready)';
        }
        return { skip, ms };
      });
    }

    function make() {
      const backdrop = document.createElement('div');
      backdrop.className = 'backdrop';
      const content = document.createElement('div');
      content.className = 'lightbox-demo-content';
      const hero = document.createElement('div');
      hero.className = 'hero';
      content.append(hero);
      return { backdrop, content, hero };
    }

    thumb.addEventListener('click', async () => {
      if (busy) return;
      busy = true;

      const { backdrop, content, hero } = make();
      backdrop.style.visibility = 'hidden';
      content.style.visibility = 'hidden';
      document.body.append(backdrop, content);
      void content.offsetHeight;

      name(thumb);
      const open = await runVT(() => {
        backdrop.style.visibility = '';
        content.style.visibility = '';
        document.documentElement.style.overflow = 'hidden';
        unname(thumb);
        name(hero);
      });

      if (open.skip) {
        setStatus('OPEN SKIPPED — ' + open.skip, 'skip');
        backdrop.remove();
        content.remove();
        document.documentElement.style.overflow = '';
        busy = false;
        return;
      }

      name(hero);
      const close = await runVT(() => {
        unname(hero);
        name(thumb);
        content.style.display = 'none';
      });

      backdrop.remove();
      content.remove();
      document.documentElement.style.overflow = '';

      if (close.skip) setStatus('CLOSE SKIPPED — ' + close.skip, 'skip');
      else setStatus('OK  open ' + open.ms + 'ms  close ' + close.ms + 'ms', 'ok');
      busy = false;
    });
  </script>
</body>
</html>
