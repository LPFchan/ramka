<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tap the photo</title>
  <style>
    html { color-scheme: light; }
    html, body { margin: 0; }
    body {
      font: 18px/1.35 system-ui, sans-serif;
      background: #fff;
      color: #111;
      min-height: 300vh;
    }
    #status {
      position: sticky;
      top: 0;
      z-index: 20;
      box-sizing: border-box;
      min-height: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 8px 16px;
      font: 700 18px/1.2 system-ui, sans-serif;
      text-align: center;
      background: #eee;
    }
    #status.skip { background: #b3261e; color: #fff; }
    #status.ok { background: #0d7a3f; color: #fff; }
    #sizes { font: 500 14px/1.2 ui-monospace, monospace; opacity: 0.8; }
    main { padding: 24px 16px 80px; text-align: center; }
    .thumb {
      width: min(72vw, 280px);
      height: calc(min(72vw, 280px) * 0.66);
      margin: 24px auto;
      border-radius: 12px;
      background: #1a73e8;
      cursor: pointer;
    }
    .hint { opacity: 0.7; max-width: 24em; margin: 0 auto; }
    .card {
      height: 28vh;
      margin: 16px;
      border-radius: 12px;
      background: #e8e8e8;
    }
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000;
    }
    /* Same covering env() box as a typical lightbox skin. */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 11;
      overflow: hidden;
      --lightbox-inset-top: calc(4rem + env(safe-area-inset-top, 0px));
      --lightbox-inset-bottom: calc(4rem + env(safe-area-inset-bottom, 0px));
    }
    .hero {
      position: absolute;
      inset: 10%;
      background: #1a73e8;
      border-radius: 12px;
    }
    ::view-transition-group(photo) { animation-duration: 0.45s; }
  </style>
</head>
<body>
  <div id="status">
    <span id="msg">Scroll, then tap a photo while the URL bar is moving</span>
    <span id="sizes"></span>
  </div>
  <main>
    <p class="hint">
      Photos are down the page on purpose. Scroll so the URL bar is hiding or
      showing, and tap a photo before it settles. Tap the overlay to close.
    </p>
    <div class="card"></div>
    <div class="card"></div>
    <div class="thumb" role="button" tabindex="0" aria-label="Open"></div>
    <div class="card"></div>
    <div class="thumb" role="button" tabindex="0" aria-label="Open"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="thumb" role="button" tabindex="0" aria-label="Open"></div>
    <div class="card"></div>
    <div class="card"></div>
  </main>
  <script>
    const msg = document.getElementById('msg');
    const sizes = document.getElementById('sizes');
    const status = document.getElementById('status');
    let busy = false;
    let session = null;

    function readSizes() {
      const vv = window.visualViewport;
      const innerH = window.innerHeight;
      const vvH = vv ? Math.round(vv.height) : innerH;
      return { innerH, vvH, gap: innerH - vvH };
    }

    function sizeLine() {
      const s = readSizes();
      return 'innerH ' + s.innerH + '  vvH ' + s.vvH + (s.gap ? '  gap ' + s.gap : '');
    }

    function paintSizes() {
      sizes.textContent = sizeLine();
    }

    function setStatus(text, kind) {
      msg.textContent = text;
      status.className = kind || '';
      paintSizes();
    }

    window.addEventListener('resize', paintSizes);
    window.addEventListener('scroll', paintSizes, { passive: true });
    window.visualViewport?.addEventListener('resize', paintSizes);
    window.visualViewport?.addEventListener('scroll', paintSizes);
    paintSizes();

    function name(el) {
      el.style.setProperty('view-transition-name', 'photo', 'important');
    }
    function unname(el) {
      el.style.setProperty('view-transition-name', 'none', 'important');
    }

    function runVT(update) {
      if (typeof document.startViewTransition !== 'function') {
        return Promise.resolve({ skip: 'No View Transitions', ms: 0 });
      }
      const t0 = performance.now();
      const t = document.startViewTransition(update);
      let skip = '';
      t.ready.then(
        () => {},
        (e) => { skip = e.name + ': ' + e.message; },
      );
      return t.finished.then(() => {
        const ms = Math.round(performance.now() - t0);
        if (!skip && ms < 120) {
          skip = 'finished in ' + ms + 'ms (aborted after ready)';
        }
        return { skip, ms };
      });
    }

    async function open(thumb) {
      if (busy || session) return;
      busy = true;
      const atStart = readSizes();

      const backdrop = document.createElement('div');
      backdrop.className = 'backdrop';
      const content = document.createElement('div');
      content.className = 'overlay';
      const hero = document.createElement('div');
      hero.className = 'hero';
      content.append(hero);
      backdrop.style.visibility = 'hidden';
      content.style.visibility = 'hidden';
      document.body.append(backdrop, content);
      void content.offsetHeight;

      name(thumb);
      const result = await runVT(() => {
        backdrop.style.visibility = '';
        content.style.visibility = '';
        document.documentElement.style.overflow = 'hidden';
        unname(thumb);
        name(hero);
      });

      if (result.skip) {
        backdrop.remove();
        content.remove();
        document.documentElement.style.overflow = '';
        unname(hero);
        unname(thumb);
        setStatus(
          'OPEN SKIPPED — ' + result.skip +
            '  (at tap innerH ' + atStart.innerH + ' vvH ' + atStart.vvH + ')',
          'skip',
        );
        busy = false;
        return;
      }

      session = { backdrop, content, hero, thumb };
      content.addEventListener('click', close);
      backdrop.addEventListener('click', close);
      setStatus('Open OK  ' + result.ms + 'ms. Tap overlay to close.', 'ok');
      busy = false;
    }

    async function close() {
      if (busy || !session) return;
      busy = true;
      const { backdrop, content, hero, thumb } = session;
      name(hero);
      const result = await runVT(() => {
        unname(hero);
        name(thumb);
        content.style.display = 'none';
      });
      backdrop.remove();
      content.remove();
      document.documentElement.style.overflow = '';
      unname(hero);
      unname(thumb);
      session = null;
      if (result.skip) {
        setStatus('CLOSE SKIPPED — ' + result.skip, 'skip');
      } else {
        setStatus('Closed. Scroll and tap a photo while the URL bar is moving.', 'ok');
      }
      busy = false;
    }

    document.querySelectorAll('.thumb').forEach((el) => {
      el.addEventListener('click', () => open(el));
    });
  </script>
</body>
</html>
